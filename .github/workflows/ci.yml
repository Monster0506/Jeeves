name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
        include:
          - python-version: "3.13"
            uv-version: "0.7.13"


    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: ${{ matrix.uv-version }}

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: |
          .venv
          .uv/cache
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        uv sync --extra dev
        uv sync --extra test

    - name: Run tests
      run: |
        uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.7.13"

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: |
          .venv
          .uv/cache
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Run security checks
      run: |
        # Run Bandit security checks
        uv run bandit -r src/ -f json -o bandit-report.json || true
        
        # Run safety checks for known vulnerabilities (using deprecated but working command)
        uv run safety check --json > safety-report-raw.json 2>/dev/null || echo '{"vulnerabilities": []}' > safety-report-raw.json
        
        # Filter out the warning lines from the raw safety report
        grep -v "DEPRECATED" safety-report-raw.json | grep -v "===" > safety-report.json || echo '{"vulnerabilities": []}' > safety-report.json
        
        # Display results
        echo "=== Bandit Security Report ==="
        if [ -f bandit-report.json ]; then
          cat bandit-report.json | jq -r '.results[] | "\(.severity): \(.issue_text) at \(.filename):\(.line_number)"' || echo "No issues found or jq not available"
        fi
        
        echo "=== Safety Report ==="
        if [ -f safety-report.json ]; then
          cat safety-report.json | jq -r '.vulnerabilities[] | "\(.severity): \(.package) \(.installed_version) - \(.advisory)"' || echo "No vulnerabilities found or jq not available"
        fi

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.7.13"

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: |
          .venv
          .uv/cache
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Run linting
      run: |
        # Run flake8 (will use pyproject.toml configuration)
        uv run flake8 src/ tests/ --count --exit-zero --statistics
        
        # Run mypy
        uv run mypy src/ --ignore-missing-imports
        
        # Run black check
        uv run black --check src/ tests/ --line-length 2000
        
        # Run isort check
        uv run isort --check-only src/ tests/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, security, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.7.13"

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: |
          .venv
          .uv/cache
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        uv sync

    - name: Build package
      run: |
        uv build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 30 